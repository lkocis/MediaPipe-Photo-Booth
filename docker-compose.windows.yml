version: "3.9"

# Za Windows: koristi ovaj fajl umjesto docker-compose.yml
# Pokretanje: docker compose -f docker-compose.windows.yml up

services:
  photo-booth:
    build: .
    image: photo-booth
    container_name: photo-booth

    environment:
      # VcXsrv X11 server mora biti pokrenut na Windowsu
      # Preuzmi s: https://sourceforge.net/projects/vcxsrv/
      - DISPLAY=host.docker.internal:0.0

    volumes:
      - ./photos:/app/photos

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Na Windowsu kamera ide kroz emulaciju - nije uvijek pouzdano
    # Ako kamera ne radi, pokušaj bez Dockera: python main.py
